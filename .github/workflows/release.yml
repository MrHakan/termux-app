name: Release APK

# Builds a single universal release APK and publishes it to a GitHub Release so
# it can be downloaded and installed directly.
#
# Triggers:
#   * Pushing a "v<major>.<minor>.<patch>" tag  -> publishes a release for that tag.
#   * Manually via the "Run workflow" button    -> publishes a pre-release for the
#     version currently in app/build.gradle, suffixed with the short commit hash.
#
# Only the apt-android-7 bootstrap is built, which covers Android 7.0 and newer.
# Splits are left disabled so a single universal APK is produced that works on
# every supported ABI.
#
# Signing:
#   If the ANDROID_KEYSTORE_BASE64 secret is configured the APK is signed with
#   that keystore. Otherwise it falls back to the public `testkey_untrusted.jks`
#   checked into this repository, which keeps it installable and keeps it
#   signature-compatible with Termux plugin apps (Termux:API, Termux:Widget, ...)
#   built from upstream sources. See docs/RELEASING.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        type: boolean
        default: true
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VARIANT: apt-android-7
      APK_DIR_PATH: ./app/build/outputs/apk/release

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v5

      # The bootstrap archives are ~100 MB each and are pinned by checksum in
      # app/build.gradle, so they can safely be cached between runs.
      - name: Cache bootstrap archives
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/bootstrap-*.zip
          key: bootstraps-${{ env.PACKAGE_VARIANT }}-${{ hashFiles('app/build.gradle') }}

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" == "tag" ]; then
            RELEASE_VERSION_NAME="$GITHUB_REF_NAME"
          else
            # Manual runs append the commit hash. The "+" keeps semver precedence intact.
            CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
            CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
            RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          fi

          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            echo "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html." >&2
            exit 1
          fi

          {
            echo "RELEASE_VERSION_NAME=$RELEASE_VERSION_NAME"
            echo "APK_NAME=termux-app_${RELEASE_VERSION_NAME}_universal.apk"
          } >> "$GITHUB_ENV"

          echo "Releasing as '$RELEASE_VERSION_NAME'"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TERMUX_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the configured release keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set; falling back to testkey_untrusted.jks."
          fi

      - name: Build release APK
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: ${{ env.PACKAGE_VARIANT }}
          # Left at 0 so a single universal APK is built rather than one per ABI.
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '0'
          TERMUX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TERMUX_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$RELEASE_VERSION_NAME"
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$APK_DIR_PATH/$APK_NAME" ]; then
            echo "Failed to find built APK at '$APK_DIR_PATH/$APK_NAME'. Files found:" >&2
            ls -la "$APK_DIR_PATH" >&2
            exit 1
          fi

          # Fail loudly rather than publishing an APK nobody can install.
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$APK_DIR_PATH/$APK_NAME"

          echo "APK_SHA256=$(sha256sum "$APK_DIR_PATH/$APK_NAME" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          EXTRA_FLAGS=()
          # Manually dispatched builds are snapshots of a branch, never a tagged release.
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "${IS_PRERELEASE:-}" == "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          if [ "${IS_DRAFT:-}" == "true" ]; then
            EXTRA_FLAGS+=(--draft)
          fi

          {
            cat <<'NOTES'
          ### Install

          Download the `.apk` below and open it to install. It works on every
          supported CPU architecture, on Android 7.0 and newer.

          > [!IMPORTANT]
          > Termux and its plugin apps must all be signed with the same key. If you
          > already have Termux installed from another source, uninstall it first,
          > otherwise the install fails with `INSTALL_FAILED_UPDATE_INCOMPATIBLE`.

          **SHA-256**
          NOTES
            printf '```\n%s  %s\n```\n' "$APK_SHA256" "$APK_NAME"
          } > release-notes.md

          # `gh release create` fails if the release already exists, so upload into
          # the existing one in that case (for example a re-run of the same tag).
          if gh release view "$RELEASE_VERSION_NAME" > /dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION_NAME" "$APK_DIR_PATH/$APK_NAME" --clobber
          else
            gh release create "$RELEASE_VERSION_NAME" \
              --title "$RELEASE_VERSION_NAME" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              "${EXTRA_FLAGS[@]}" \
              "$APK_DIR_PATH/$APK_NAME"
          fi
