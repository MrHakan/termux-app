name: Unit tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# A newer push to the same branch or pull request supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Setup java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v5
    # Compiling the app depends on the bootstrap archives (~100 MB each), so the
    # tests download them too. They are pinned by checksum in app/build.gradle.
    - name: Cache bootstrap archives
      uses: actions/cache@v4
      with:
        path: app/src/main/cpp/bootstrap-*.zip
        key: bootstraps-apt-android-7-${{ hashFiles('app/build.gradle') }}
    # `test` runs every unit test once per build type. The tests are shared by
    # both build types, so the release pass only doubled the time.
    - name: Execute tests
      run: |
        ./gradlew testDebugUnitTest
