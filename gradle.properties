## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# R8 and the ndk-build of four ABIs are memory hungry, and CI runners have
# plenty to spare. 2 GB caused avoidable GC thrashing on release builds.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# The four modules only depend on each other in a chain, so the independent
# work (native builds, resource processing) parallelises well.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# Termux must keep targeting SDK 28. Android 10 (API 29) applies a W^X
# restriction that forbids apps targeting API 29+ from executing files written
# to their own data directory, which is exactly what Termux does for every
# package installed through `pkg`/`apt`. Raising this breaks the app's core
# functionality. compileSdkVersion is kept current so that new platform APIs can
# still be called behind Build.VERSION.SDK_INT guards.
minSdkVersion=21
targetSdkVersion=28
ndkVersion=29.0.14206865
compileSdkVersion=36

# Kept in one place because several modules depend on them and a mismatch between
# `app` and `termux-shared` silently resolves to whichever version is higher.
markwonVersion=4.6.2
guavaVersion=33.4.8-android
androidxAnnotationVersion=1.10.0
# These are the newest releases that still support minSdk 21 (Android 5.0), which
# the apt-android-5 build targets. Every later release raises its own minSdk to 23,
# and androidx.core 1.19.0 additionally requires compileSdk 37, which AGP 8.13.2
# does not support. Raise these only together with minSdkVersion.
androidxCoreVersion=1.17.0
